apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: postgres
  annotations:
    openchoreo.dev/local-dev-addresses: client=outputs.host:outputs.port
    openchoreo.dev/description: >-
      In-cluster PostgreSQL database backed by a single-replica StatefulSet.
      Storage defaults to ephemeral (emptyDir), for demonstration purposes
      only; set environmentConfigs.persistenceEnabled to back it with a PVC
      instead.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        database:
          type: string
          default: appdb
        initSQL:
          type: string
          default: ""
          description: >-
            SQL run once at initdb, on first boot when the data directory
            is empty. Changing this after the database has already
            initialized has no effect.

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        memory:
          type: string
          default: 256Mi
        persistenceEnabled:
          type: boolean
          default: false
          description: >-
            Back the data volume with a PVC (via volumeClaimTemplates)
            instead of emptyDir. The PVC survives pod recreation (e.g. a
            StatefulSet rolling update triggered by changing `memory`), so
            data is not lost when the pod restarts or is rescheduled.
        storageSize:
          type: string
          default: 1Gi
          description: Only used when persistenceEnabled is true.
        storageClassName:
          type: string
          default: ""
          description: >-
            Only used when persistenceEnabled is true. Empty string uses the
            cluster's default StorageClass.

  retainPolicy: Delete

  outputs:
    - name: host
      value: "${metadata.name}.${metadata.namespace}.svc.cluster.local"
    - name: port
      value: "5432"
    - name: database
      configMapKeyRef:
        name: "${metadata.name}-config"
        key: database
    # The application user (limited grants), created at initdb by the bootstrap
    # script. Applications consume this output via Workload envBindings.
    - name: username
      configMapKeyRef:
        name: "${metadata.name}-config"
        key: username
    - name: password
      secretKeyRef:
        name: "${metadata.name}-creds"
        key: password
    # Convenience output: full Postgres connection URL with the application
    # user's password embedded. Composed on the data plane by ESO's secret
    # template; the password bytes never reach the control plane (same
    # guarantee as the `password` output). sslmode=disable matches the
    # CRT's plaintext StatefulSet config.
    - name: url
      secretKeyRef:
        name: "${metadata.name}-creds"
        key: url
  resources:
    - id: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${metadata.name}-config
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        data:
          database: ${parameters.database}
          username: ${metadata.resourceName}-user

    # The bootstrap script creates only the least-privileged application
    # user. The image-created postgres superuser is reserved for internal use;
    # its password is ESO-generated and never surfaced.
    - id: init-scripts
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${metadata.name}-init
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        data:
          01-create-app-user.sh: |
            #!/bin/bash
            set -e
            psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
              CREATE USER "$APPUSER" WITH PASSWORD '$APPUSER_PASSWORD';
              GRANT ALL ON DATABASE "$POSTGRES_DB" TO "$APPUSER";
              GRANT ALL ON SCHEMA public TO "$APPUSER";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO "$APPUSER";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO "$APPUSER";
            EOSQL
          # Optional app schema, supplied via parameters.initSQL. Runs after the
          # app user exists (03, alphabetical) so it's a no-op when unset — the
          # 01 script's ALTER DEFAULT PRIVILEGES above covers tables created
          # here even though they're owned by the postgres superuser.
          03-app-schema.sql: |
            ${parameters.initSQL}

    # Postgres superuser password: generated on the data plane by ESO and
    # never written to the control plane. Used by initdb and by the init
    # scripts above; not surfaced to consumers.
    - id: password-gen-postgres
      template:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        metadata:
          name: ${metadata.name}-creds-postgres
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          length: 32
          digits: 8
          symbols: 0
          noUpper: false
          allowRepeat: true

    - id: creds-postgres
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.name}-creds-postgres
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          # Sync once. The Password generator is stateless — every call
          # returns a NEW random value, so a non-zero refreshInterval would
          # rotate the password and break the postgres user (whose password
          # is baked in at initdb).
          refreshInterval: "0"
          target:
            name: ${metadata.name}-creds-postgres
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: ${metadata.name}-creds-postgres

    # Application user password: generated on the data plane by ESO and
    # never written to the control plane. Surfaced via the `password` output
    # as a secretKeyRef.
    - id: password-gen-app
      template:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        metadata:
          name: ${metadata.name}-creds
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          length: 32
          digits: 8
          symbols: 0
          noUpper: false
          allowRepeat: true

    - id: creds
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.name}-creds
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          # Sync once — see note above the `creds-postgres` ExternalSecret.
          refreshInterval: "0"
          target:
            name: ${metadata.name}-creds
            creationPolicy: Owner
            # ESO templates the Secret data DP-side using the fetched
            # password. The control plane only stores the literal `{{ .password }}`
            # placeholder, never the resolved bytes.
            template:
              type: Opaque
              data:
                password: "{{ .password }}"
                url: "postgres://${metadata.resourceName}-user:{{ .password }}@${metadata.name}.${metadata.namespace}.svc.cluster.local:5432/${parameters.database}?sslmode=disable"
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: ${metadata.name}-creds

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          selector:
            app: ${metadata.name}
          ports:
            - name: postgres
              port: 5432
              targetPort: 5432

    - id: statefulset
      readyWhen: "${has(applied.statefulset.status.readyReplicas) && has(applied.statefulset.status.replicas) && applied.statefulset.status.readyReplicas == applied.statefulset.status.replicas && applied.statefulset.status.replicas > 0}"
      template:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          serviceName: ${metadata.name}
          replicas: 1
          selector:
            matchLabels:
              app: ${metadata.name}
          # Only present when persistenceEnabled is true. A StatefulSet's
          # volumeClaimTemplates-backed PVCs survive pod recreation (e.g. a
          # rolling update triggered by changing `memory`), unlike emptyDir.
          # volumeClaimTemplates is immutable after StatefulSet creation, so
          # persistenceEnabled effectively only takes effect at create time —
          # toggling it afterward will fail to apply.
          volumeClaimTemplates: |
            ${environmentConfigs.persistenceEnabled
              ? [{"metadata": {"name": "data"},
                  "spec": {"accessModes": ["ReadWriteOnce"],
                           "resources": {"requests": {"storage": environmentConfigs.storageSize}},
                           "storageClassName": environmentConfigs.storageClassName != ""
                             ? environmentConfigs.storageClassName
                             : oc_omit()}}]
              : oc_omit()}
          # Delete the PVC when the StatefulSet itself is torn down (Resource
          # deleted), but keep it across ordinary pod restarts/rolling updates.
          persistentVolumeClaimRetentionPolicy: |
            ${environmentConfigs.persistenceEnabled
              ? {"whenDeleted": "Delete", "whenScaled": "Retain"}
              : oc_omit()}
          template:
            metadata:
              labels:
                app: ${metadata.name}
            spec:
              containers:
                - name: postgres
                  image: postgres:16-alpine
                  resources:
                    limits:
                      memory: ${environmentConfigs.memory}
                  env:
                    - name: POSTGRES_USER
                      value: postgres
                    - name: POSTGRES_DB
                      valueFrom:
                        configMapKeyRef:
                          name: ${metadata.name}-config
                          key: database
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${metadata.name}-creds-postgres
                          key: password
                    - name: APPUSER
                      valueFrom:
                        configMapKeyRef:
                          name: ${metadata.name}-config
                          key: username
                    - name: APPUSER_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${metadata.name}-creds
                          key: password
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  ports:
                    - containerPort: 5432
                      name: postgres
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
                    - name: init-scripts
                      mountPath: /docker-entrypoint-initdb.d
              volumes:
                # Omitted when persistenceEnabled is true — the "data" volume
                # is supplied by volumeClaimTemplates above instead.
                - |
                  ${environmentConfigs.persistenceEnabled
                    ? oc_omit()
                    : {"name": "data", "emptyDir": {}}}
                - name: init-scripts
                  configMap:
                    name: ${metadata.name}-init
                    defaultMode: 493
